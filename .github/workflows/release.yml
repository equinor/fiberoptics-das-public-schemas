name: CI Release

on:
  push:
    branches: main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Release
        run: |
          git config user.email "jsv-ci@equinor.com"
          git config user.name "JSV CI"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git
          echo CI release
          export CURRENT_VERSION=`./bin/version.sh -c`
          echo Setting current version ${CURRENT_VERSION} in readme.adoc
          sed -i -e "s/^Latest version: .*/Latest version: ${CURRENT_VERSION}/" readme.adoc
          if git diff --quiet -- readme.adoc; then
            echo "No readme.adoc change; skipping version commit."
          else
            git add readme.adoc
            git commit -m "Current version ${CURRENT_VERSION}"
          fi
          if git rev-parse -q --verify "refs/tags/v${CURRENT_VERSION}" > /dev/null; then
            echo "Tag v${CURRENT_VERSION} already exists; skipping."
          else
            echo tagging version ${CURRENT_VERSION}
            git tag "v${CURRENT_VERSION}"
          fi
          git push origin main --tags

      - name: Setting next version
        run: |
          export CURRENT_VERSION=`./bin/version.sh -c`
          export NEXT_VERSION=`./bin/version.sh -n`
          echo Setting next version ${NEXT_VERSION} in pom.xml and charts
          UPDATED_FILES=`./bin/version.sh -u`
          for UPDATED in $UPDATED_FILES; do
            git add "$UPDATED"
          done
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "Next version ${NEXT_VERSION}"
            echo "pushing updated version"
            git push origin main
          fi

      - name: Publish package
        run: mvn -B deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
