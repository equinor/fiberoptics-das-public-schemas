name: CI Testing

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    env:
      MAVEN_CMD: ./mvnw --no-transfer-progress

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test changes
        run: ${MAVEN_CMD} test
